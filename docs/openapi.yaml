{
  "openapi": "3.1.0",
  "info": {
    "title": "API CBT U-Cademy",
    "version": "0.1.0",
    "description": "Fondasi API saja untuk layanan CBT U-Cademy mandiri. Satu-satunya endpoint yang tersedia saat ini dan tidak bergantung pada proses bisnis adalah pemeriksaan kesehatan."
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Server pengembangan Docker lokal"
    }
  ],
  "paths": {
    "/api/health": {
      "get": {
        "operationId": "getCbtApiHealth",
        "summary": "Periksa ketersediaan API",
        "description": "Mengembalikan respons kesehatan minimal tanpa data lingkungan atau pengguna.",
        "responses": {
          "200": {
            "description": "Proses API tersedia.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["success", "service"],
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "const": true
                    },
                    "service": {
                      "type": "string",
                      "const": "cbt-api"
                    }
                  }
                },
                "example": {
                  "success": true,
                  "service": "cbt-api"
                }
              }
            }
          }
        }
      }
    }
  }
}
